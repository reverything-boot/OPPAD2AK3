
name: OP Pad 2 - OEM source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl python3

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize OnePlus Pad 2 sources
        run: |
          set -euo pipefail
          mkdir -p oem
          cd oem

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest \
            -b oneplus/sm8650 \
            -m oneplus_pad2_b.xml \
            --repo-rev=v2.16

      - name: Download OEM sources
        working-directory: oem
        run: |
          set -euo pipefail
          repo sync -c --no-tags -j2

      - name: Record exact source revisions
        working-directory: oem
        run: |
          set -euo pipefail

          repo manifest -r -o source-lock.xml

          repo forall -c \
            'printf "%s %s %s\n" \
            "$REPO_PATH" "$REPO_PROJECT" \
            "$(git rev-parse HEAD)"' \
            > source-commits.txt

          git -C .repo/manifests rev-parse HEAD \
            > manifest-commit.txt

          find kernel_platform -type f \
            -name 'oplus_build_kernel.sh' -print \
            > build-script-paths.txt || true

          echo "Source revisions recorded."

      - name: Save audit files
        uses: actions/upload-artifact@v4
        with:
          name: oppad2-oos16-source-audit
          path: |
            oem/source-lock.xml
            oem/source-commits.txt
            oem/manifest-commit.txt
            oem/build-script-paths.txt
          if-no-files-found: error
          retention-days: 14
          
